services:
  - type: web
    name: ankur-ai
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: LIVE_VOICE
        value: Charon
      - key: MAX_SESSION_SECONDS
        value: "600"
      - key: GREET
        value: "1"
